name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test (${{ matrix.os }} / Py ${{ matrix.python-version }} / Node ${{ matrix.node-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13"]
        node-version: ["18", "20", "22"]
        exclude:
          # Keep full Python matrix on Ubuntu, smoke key versions on Windows & macOS to optimize CI resources
          - os: windows-latest
            python-version: "3.10"
          - os: windows-latest
            python-version: "3.11"
          - os: windows-latest
            node-version: "18"
          - os: windows-latest
            node-version: "22"
          - os: macos-latest
            python-version: "3.10"
          - os: macos-latest
            python-version: "3.11"
          - os: macos-latest
            node-version: "18"
          - os: macos-latest
            node-version: "22"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Set up Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Install Node dependencies
        run: npm ci

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
          python -m pip install ruff

      - name: Run Ruff Linter
        run: ruff check .

      - name: Verify Python Bytecode Compilation
        run: python -m compileall -q src tests

      - name: Run Pytest Suite
        env:
          PYTHONIOENCODING: utf-8
        run: python -m pytest -ra -v

      - name: Verify Node CLI Wrapper Smoke
        run: npm run smoke
