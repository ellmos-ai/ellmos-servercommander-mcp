[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ellmos-servercommander-mcp"
version = "0.1.0a21"
description = "MCP server for server operations: deploy, mail, log analysis, health checks."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE", "NOTICE", "THIRD_PARTY_LICENSES.md", "THIRD_PARTY_LICENSES.txt"]
requires-python = ">=3.10"
authors = [{ name = "Lukas Geiger" }]
keywords = [
    "ai-agents",
    "apache-logs",
    "claude-code",
    "deployment",
    "devops",
    "dry-run",
    "ellmos-ai",
    "fastmcp",
    "health-check",
    "local-first",
    "log-analysis",
    "mcp-server",
    "model-context-protocol",
    "nginx-logs",
    "open-bricks",
    "python",
    "server-management",
    "server-operations",
    "sysadmin",
    "zero-egress",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "Operating System :: OS Independent",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: System :: Systems Administration",
    "Topic :: Internet :: Log Analysis",
    "Topic :: Software Development :: Build Tools",
    "Topic :: Communications :: Email",
    "Topic :: Security",
]
dependencies = [
    "mcp>=1.0.0,<2.0.0",
]

[project.urls]
Homepage = "https://github.com/ellmos-ai/ellmos-servercommander-mcp"
Documentation = "https://github.com/ellmos-ai/ellmos-servercommander-mcp#readme"
Repository = "https://github.com/ellmos-ai/ellmos-servercommander-mcp.git"
"Bug Tracker" = "https://github.com/ellmos-ai/ellmos-servercommander-mcp/issues"
Changelog = "https://github.com/ellmos-ai/ellmos-servercommander-mcp/blob/main/CHANGELOG.md"
Security = "https://github.com/ellmos-ai/ellmos-servercommander-mcp/blob/main/SECURITY.md"
Notice = "https://github.com/ellmos-ai/ellmos-servercommander-mcp/blob/main/NOTICE"
"Third-Party Licenses" = "https://github.com/ellmos-ai/ellmos-servercommander-mcp/blob/main/THIRD_PARTY_LICENSES.md"
"Third-Party Licenses (Text)" = "https://github.com/ellmos-ai/ellmos-servercommander-mcp/blob/main/THIRD_PARTY_LICENSES.txt"
"Level 1 SBOM" = "https://github.com/ellmos-ai/ellmos-servercommander-mcp/blob/main/THIRD_PARTY_LICENSES.md"
"Plain-Text License" = "https://github.com/ellmos-ai/ellmos-servercommander-mcp/blob/main/LICENSE"
"Marketing Log" = "https://github.com/ellmos-ai/ellmos-servercommander-mcp/blob/main/MARKETING-LOG.txt"
"LLM Ready" = "https://github.com/ellmos-ai/ellmos-servercommander-mcp/blob/main/llms.txt"
"Parent Organization" = "https://github.com/ellmos-ai"
"Umbrella Ecosystem" = "https://github.com/open-bricks"

[project.optional-dependencies]
sftp = ["paramiko>=3.0"]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23", "ruff>=0.5.0"]

[project.scripts]
ellmos-servercommander = "servercommander.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/servercommander"]

[tool.pytest.ini_options]
minversion = "7.0"
pythonpath = ["src"]
testpaths = ["tests"]
norecursedirs = [".git", ".pytest_cache", ".pytest_tmp*", ".ruff_cache", "build", "dist", "node_modules", ".venv"]
addopts = "-ra -v --strict-markers --basetemp=.pytest_tmp"

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = [
    "E",
    "F",
    "W",
    "I",
    "UP",
    "B",
    "SIM",
    "C4",
    "RUF",
]
ignore = [
    "RUF001",
]
