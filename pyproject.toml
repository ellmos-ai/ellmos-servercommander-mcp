[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ellmos-servercommander-mcp"
version = "0.1.0a18"
description = "MCP server for server operations: deploy, mail, log analysis, health checks."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [{ name = "Lukas Geiger" }]
keywords = [
    "mcp",
    "model-context-protocol",
    "server-operations",
    "server-management",
    "deploy",
    "deployment-dry-run",
    "access-log-analysis",
    "health-check",
    "devops",
    "dry-run",
    "local-first",
    "i18n",
    "ellmos",
    "open-bricks",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: System :: Systems Administration",
    "Topic :: Internet :: Log Analysis",
    "Topic :: Software Development :: Build Tools",
    "Topic :: Communications :: Email",
    "Topic :: Security",
]
dependencies = [
    "mcp>=1.0.0",
]

[project.urls]
Homepage = "https://github.com/ellmos-ai/ellmos-servercommander-mcp"
Documentation = "https://github.com/ellmos-ai/ellmos-servercommander-mcp#readme"
Repository = "https://github.com/ellmos-ai/ellmos-servercommander-mcp.git"
"Bug Tracker" = "https://github.com/ellmos-ai/ellmos-servercommander-mcp/issues"
Changelog = "https://github.com/ellmos-ai/ellmos-servercommander-mcp/blob/main/CHANGELOG.md"
Security = "https://github.com/ellmos-ai/ellmos-servercommander-mcp/blob/main/SECURITY.md"
"Parent Organization" = "https://github.com/ellmos-ai"
"Umbrella Ecosystem" = "https://github.com/open-bricks"

[project.optional-dependencies]
sftp = ["paramiko>=3.0"]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23", "ruff>=0.5.0"]

[project.scripts]
ellmos-servercommander = "servercommander.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/servercommander"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-ra -v --strict-markers"

[tool.ruff]
line-length = 120
target-version = "py310"
